<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Niko Beyond — Aventura</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d0d; color: #e8e8de; font-family: 'Trebuchet MS', system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    #game { display: block; width: 100vw; height: 100dvh; image-rendering: pixelated; touch-action: none; }
    .hud { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 18px; color: #e8e8de; font-size: 12px; letter-spacing: 3px; text-shadow: 0 2px 5px #000, 0 0 12px #000; pointer-events: none; z-index: 2; padding: 8px 10px; border-left: 2px solid #98583a; background: linear-gradient(90deg,#101312d9,transparent); }
    .hint { position: fixed; top: 55px; left: 28px; color: #b0ada2; font-size: 11px; letter-spacing: .7px; text-shadow: 0 2px 5px #000; pointer-events: none; z-index: 2; }
    .controls { position: fixed; inset: auto 0 max(22px, env(safe-area-inset-bottom)) 0; display: none; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 3; }
    .group { display: flex; gap: 10px; }
    .control { pointer-events: auto; width: 64px; height: 64px; border: 1px solid #9b755e99; border-radius: 7px; background: linear-gradient(145deg,#292b28eF,#111412eF); box-shadow: inset 0 1px #ffffff12, 0 5px 18px #0008; color: #e8e1d5; font-size: 27px; display: grid; place-items: center; user-select: none; -webkit-user-select: none; touch-action: none; }
    .control:active { background: #65432feF; border-color: #c58a62; transform: translateY(1px); }
    .title-screen { position: fixed; inset: 0; z-index: 9999; pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; background: linear-gradient(180deg, #0e0f10ee, #171918df 60%, #0e0f10f5); }
    .title-mark { color: #e8e8de; font-size: clamp(42px, 10vw, 78px); font-weight: 900; letter-spacing: .16em; line-height: .95; text-shadow: 0 4px 0 #000; }
    .title-mark span { display: block; margin-top: 12px; color: #7a4029; font-size: .34em; letter-spacing: .72em; padding-left: .72em; }
    .title-kicker { margin: 32px 0 18px; color: #a8a99f; font-size: 10px; letter-spacing: .22em; }
    .title-rule { width: min(340px, 75vw); height: 1px; background: linear-gradient(90deg, transparent, #7a4029, transparent); margin-bottom: 24px; }
    .start-button { position: relative; z-index: 10000; pointer-events: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; width: min(340px, 82vw); padding: 16px 18px; border: 1px solid #665044; border-radius: 2px; background: #202220; color: #e8e8de; font-size: 12px; letter-spacing: .12em; cursor: pointer; transition: background .2s, border-color .2s; }
    .start-button:hover, .start-button:focus { background: #34322d; border-color: #9a6347; outline: none; }
    .title-foot { margin-top: 22px; color: #77786f; font-size: 9px; letter-spacing: .1em; }
    @media (min-width: 800px) { .controls { opacity: .72; } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Protótipo jogável de Niko Beyond"></canvas>
  <div class="hud">NIKO BEYOND <span style="color:#7a4029">/ CAPÍTULO 01</span></div>
  <div class="hint">Explore o ferro-velho abandonado</div>
  <section id="titleScreen" class="title-screen">
    <div class="title-mark">NIKO<span>BEYOND</span></div>
    <p class="title-kicker">UMA AVENTURA EM UM MUNDO ESQUECIDO</p>
    <div class="title-rule"></div>
    <button id="startGame" class="start-button">▶ &nbsp; COMEÇAR A AVENTURA</button>
    <p class="title-foot">ANDAR: ← → &nbsp; · &nbsp; PULAR: ↑ / ESPAÇO</p>
  </section>
  <div class="controls">
    <div class="group">
      <button class="control" id="left" aria-label="Mover para a esquerda">←</button>
      <button class="control" id="right" aria-label="Mover para a direita">→</button>
    </div>
    <div class="group">
      <button class="control" id="jump" aria-label="Pular">↑</button>
    </div>
  </div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 270;
  canvas.width = W; canvas.height = H;
  let scale = 1, ox = 0, oy = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    scale = Math.max(canvas.width / W, canvas.height / H);
    ox = (canvas.width - W * scale) / 2;
    oy = (canvas.height - H * scale) / 2;
  }
  addEventListener('resize', resize); resize();

  const keys = { left:false, right:false };
  const player = { x:52, y:192, vx:0, vy:0, w:14, h:24, grounded:false, facing:1 };
  const platforms = [
    {x:0,y:222,w:480,h:48},
    {x:145,y:188,w:58,h:8},
    {x:274,y:162,w:66,h:8},
    {x:376,y:198,w:45,h:8}
  ];
  let camera = 0, time = 0, started = false;
  const stars = Array.from({length:42}, (_,i)=>({x:(i*83+17)%480,y:(i*47+11)%150,s:(i%3)+1}));
  const debris = Array.from({length:18},(_,i)=>({x:i*31+8,h:5+(i*13)%19,w:8+(i*7)%18}));

  function rect(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
  const nikoSprite = new Image();
  nikoSprite.src = './assets/niko.svg';
  let nikoSpriteReady = false;
  nikoSprite.onload = () => { nikoSpriteReady = true; };

  function drawNiko() {
    const x = Math.round(player.x), y = Math.round(player.y);
    // sombra sob os pés
    rect(x-5,y+player.h+1,25,3,'#090a0b');
    if (nikoSpriteReady) {
      ctx.save();
      if (player.facing < 0) {
        ctx.translate(x + 16, y - 24);
        ctx.scale(-1,1);
        ctx.drawImage(nikoSprite,0,0,32,48);
      } else {
        ctx.drawImage(nikoSprite,x-9,y-24,32,48);
      }
      ctx.restore();
    } else {
      rect(x+2,y,11,9,'#737b7d');
      rect(x+4,y+3,7,3,'#171b1c');
      rect(x+8,y+4,2,2,'#e8e8de');
      rect(x+3,y+9,9,8,'#4d5557');
      rect(x+3,y+17,3,5,'#555c5e'); rect(x+9,y+17,3,5,'#555c5e');
    }
  }

  function drawBackground() {
    // Céu frio e enfumaçado, com uma luz discreta no horizonte.
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0c1012'); g.addColorStop(.48,'#1b2021'); g.addColorStop(1,'#343735');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // Bruma em camadas para dar profundidade ao ferro-velho.
    ctx.fillStyle='#92958a0a'; ctx.fillRect(0,105,W,50);
    ctx.fillStyle='#a5a18d0b'; ctx.fillRect(0,155,W,33);
    stars.forEach((s,i)=>rect((s.x-camera*.12+480)%480,s.y,s.s===1?1:2,1,'#777a73'));
    // Silhuetas industriais distantes.
    for(let i=0;i<10;i++){
      const x=((i*67-camera*.16)%590+590)%590-45;
      const top=116+(i%4)*8;
      rect(x,top,27,222-top,'#171c1c');
      rect(x+5,top-12,15,15,'#171c1c');
      rect(x+2,top+16,3,29,'#292f2e');
      rect(x+21,top+27,2,19,'#292f2e');
      if(i%3===0){ rect(x+7,top+30,2,9,'#80513a'); rect(x+10,top+30,1,9,'#b17b4f'); }
    }
    // Guindaste e cabos em silhueta.
    rect(18,91,2,82,'#252a29'); rect(18,91,83,2,'#252a29'); rect(96,91,2,38,'#252a29');
    rect(77,129,2,13,'#554332'); rect(73,140,10,3,'#554332');
    // Lua enevoada com halo.
    ctx.fillStyle='#c2c1ad0d'; ctx.beginPath(); ctx.arc(375,54,29,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9da39c36'; ctx.beginPath(); ctx.arc(375,54,19,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c2c7b968'; ctx.beginPath(); ctx.arc(370,50,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#727974'; ctx.beginPath(); ctx.arc(365,46,10,0,Math.PI*2); ctx.fill();
    // Reflexos ferrugem em pontos de sucata.
    rect(34,171,15,2,'#65412f'); rect(36,173,2,5,'#98603e');
    rect(302,162,2,12,'#8b5a3c'); rect(305,170,9,2,'#67412e');
    // Chão industrial em camadas.
    rect(0,222,W,48,'#303533'); rect(0,222,W,2,'#7c8178');
    rect(0,226,W,2,'#424843'); rect(0,244,W,2,'#272c2a');
    debris.forEach((d,i)=>{
      const x=((d.x-camera*.65)%510+510)%510-15;
      rect(x,222-d.h,d.w,d.h,'#202624');
      rect(x+1,222-d.h,d.w-2,2,'#51574f');
      if(i%4===0) rect(x+3,222-d.h+4,2,2,'#865238');
    });
    // Vinheta sutil nas bordas.
    const v=ctx.createRadialGradient(W/2,H/2,45,W/2,H/2,245);
    v.addColorStop(0,'#00000000'); v.addColorStop(1,'#05070755');
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }

  function drawPlatforms() {
    platforms.slice(1).forEach(p=>{
      const x=p.x-camera;
      rect(x,p.y,p.w,p.h,'#4c5354'); rect(x,p.y,p.w,2,'#8b9291');
      rect(x+5,p.y+3,8,2,'#2c3132'); rect(x+p.w-14,p.y+3,7,2,'#2c3132');
    });
  }

  function update() {
    if (!started) return;
    time++;
    player.vx = (keys.right?1:0) - (keys.left?1:0);
    if(player.vx) player.facing = player.vx;
    player.x += player.vx*1.45;
    player.x = Math.max(4,Math.min(464,player.x));
    player.vy += 0.24;
    player.y += player.vy;
    player.grounded = false;
    for(const p of platforms){
      if(player.x+player.w>p.x && player.x<p.x+p.w &&
         player.y+player.h>=p.y && player.y+player.h<=p.y+10 && player.vy>=0){
        player.y=p.y-player.h; player.vy=0; player.grounded=true;
      }
    }
    camera = Math.max(0,Math.min(480,player.x-155));
    if(player.y>H+40){player.x=52;player.y=192;player.vy=0;}
  }

  function render() {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='#101113'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(scale,0,0,scale,ox,oy);
    drawBackground();
    ctx.save(); ctx.translate(-camera,0); drawPlatforms(); ctx.restore();
    drawNiko();
    // instrução discreta no cenário
    if(time<500){ctx.fillStyle='#b6bdbd';ctx.font='7px monospace';ctx.fillText('A SOLIDAO TAMBEM DEIXA RASTROS...',150,24);}
    requestAnimationFrame(render);
  }

  function loop(){update();requestAnimationFrame(loop);}
  function bindButton(id,key){
    const el=document.getElementById(id);
    const down=e=>{e.preventDefault(); if(key==='jump'){if(player.grounded)player.vy=-5.2;}else keys[key]=true;};
    const up=e=>{e.preventDefault();if(key!=='jump')keys[key]=false;};
    el.addEventListener('pointerdown',down); el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up); el.addEventListener('pointerleave',up);
  }
  bindButton('left','left'); bindButton('right','right'); bindButton('jump','jump');
  addEventListener('keydown',e=>{
    if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;
    if(['ArrowRight','d','D'].includes(e.key))keys.right=true;
    if(['ArrowUp',' ','w','W'].includes(e.key)&&player.grounded){player.vy=-5.2;e.preventDefault();}
  });
  addEventListener('keyup',e=>{
    if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;
    if(['ArrowRight','d','D'].includes(e.key))keys.right=false;
  });
  function startAdventure(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    started = true;
    const title = document.getElementById('titleScreen');
    const controls = document.querySelector('.controls');
    if (title) title.style.display = 'none';
    if (controls) controls.style.display = 'flex';
  }
  const startButton = document.getElementById('startGame');
  startButton.addEventListener('click', startAdventure);
  startButton.addEventListener('pointerup', startAdventure);
  startButton.addEventListener('touchend', startAdventure, { passive: false });

  loop(); render();
})();
</script>
</body>
</html>
